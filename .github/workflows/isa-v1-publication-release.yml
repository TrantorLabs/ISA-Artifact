name: ISA v1.0.0 official publication release
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/isa-v1-publication-release.yml'
      - 'RELEASE_NOTES.md'
      - 'VERSION'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  freeze-and-release:
    if: github.repository == 'TrantorLabs/ISA-Artifact' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Assert exact official release material and historical provenance
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat VERSION)" = "1.0.0"
          test -s LICENSE && test -s NOTICE && test -s CITATION.cff
          test -s archive/ISA_ARTIFACT_v0.1.0_SOURCE_AND_EVIDENCE.zip
          (cd archive && sha256sum -c ISA_ARTIFACT_v0.1.0_SOURCE_AND_EVIDENCE.zip.sha256)
          test -s research/external/langgraph_counterexample.py
          test -s scripts/verify.py && test -s formal/check.py
          test -s docs/paper/ISA_CN_v1.2_FINAL.md
          if [[ -n "$(git status --porcelain)" ]]; then echo "DIRTY_SOURCE"; exit 1; fi
      - name: Package exact merged publication code
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _release
          git archive --format=zip --output=_release/ISA-Artifact-v1.0.0-source.zip "$GITHUB_SHA"
          (cd _release && sha256sum ISA-Artifact-v1.0.0-source.zip > SHA256SUMS.txt)
          unzip -t _release/ISA-Artifact-v1.0.0-source.zip | tail -1
      - name: Create immutable v1.0.0 tag and GitHub Release, no overwrite
        shell: bash
        run: |
          set -euo pipefail
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release v1.0.0 already exists; refusing to overwrite"
            exit 1
          fi
          gh release create v1.0.0 \
            _release/ISA-Artifact-v1.0.0-source.zip _release/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "ISA-Artifact v1.0.0 — Verified Research Release" \
            --notes-file RELEASE_NOTES.md \
            --latest
      - name: Re-download published assets and verify commit tag and bytes
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin refs/tags/v1.0.0 | awk '{print $1}')" = "$GITHUB_SHA"
          mkdir -p /tmp/isa-official-release
          gh release download v1.0.0 --repo "$GITHUB_REPOSITORY" --dir /tmp/isa-official-release
          for f in ISA-Artifact-v1.0.0-source.zip SHA256SUMS.txt; do
            cmp "_release/$f" "/tmp/isa-official-release/$f"
          done
          (cd /tmp/isa-official-release && sha256sum -c SHA256SUMS.txt)
          echo "ISA_V1_OFFICIAL_RELEASE_VERIFIED"
